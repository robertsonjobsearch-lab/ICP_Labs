name: icp-lead-finder

x-database-url: &database-url "postgresql+psycopg://${POSTGRES_USER:-icp_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-icp_lead_finder}"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icp_lead_finder}
      POSTGRES_USER: ${POSTGRES_USER:-icp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data
    # No ports: PostgreSQL is reachable only from containers on the "data" network.

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: *database-url
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      CONTACT_PROVIDER: ${CONTACT_PROVIDER:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      APOLLO_USER_DAILY_CREDIT_BUDGET: ${APOLLO_USER_DAILY_CREDIT_BUDGET:-25}
      APOLLO_DAILY_CREDIT_BUDGET: ${APOLLO_DAILY_CREDIT_BUDGET:-100}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      SEARCH_RATE_LIMIT_PER_MINUTE: ${SEARCH_RATE_LIMIT_PER_MINUTE:-20}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data
      - web

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - web

  # Test runners (not started by `docker compose up`):
  #   docker compose run --rm --build backend-test
  #   docker compose run --rm --build frontend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-icp_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-icp_lead_finder}_test"
      TEST_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-icp_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-icp_lead_finder}_test"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
    network_mode: none

volumes:
  postgres_data:

networks:
  data:
  web:
